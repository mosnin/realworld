name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v22.22.2"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Verify production dependency overrides
        run: pnpm verify:dependencies
      - name: Audit production dependencies
        run: pnpm audit:production
      - name: Convex tests
        run: pnpm exec vitest run tests/convex
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec convex dev --once --tail-logs disable --start "node scripts/verification/run-authenticated-e2e.mjs"
      - name: Verify foundation evidence
        env:
          RW_EVIDENCE_AUTOMATED: install,lint,typecheck,unit,convex-tests,build,chromium
          RW_EVIDENCE_RENDER: mission-world
          RW_EVIDENCE_INTERACTION: mission-world,room-directory,keyboard
        run: node scripts/verification/phase-evidence.mjs --phase=foundation
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
