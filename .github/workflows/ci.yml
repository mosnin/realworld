name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Convex tests
        run: pnpm exec vitest run tests/convex
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec convex dev --once --tail-logs disable --start "node scripts/verification/run-authenticated-e2e.mjs"
      - name: Verify foundation evidence
        env:
          RW_EVIDENCE_AUTOMATED: install,lint,typecheck,unit,convex-tests,build,chromium
          RW_EVIDENCE_RENDER: mission-world
          RW_EVIDENCE_INTERACTION: mission-world,room-directory,keyboard
        run: node scripts/verification/phase-evidence.mjs --phase=foundation
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
